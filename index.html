        const playBeep = (freq = 600, duration = 0.08) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                // Audio not allowed without prior interaction
            }
        };

            const [currency, setCurrency] = useState('USD'); // 'USD' or 'SOS'
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [customizingItem, setCustomizingItem] = useState(null);
            const [selectedAddons, setSelectedAddons] = useState([]);
            const [itemNotes, setItemNotes] = useState('');

            const [deliveryAddress, setDeliveryAddress] = useState('');
            const [paymentMethod, setPaymentMethod] = useState('EVC_PLUS');
            const [orderNote, setOrderNote] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            // Sync with LocalStorage
            useEffect(() => {
                localStorage.setItem('ganaan_products', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('ganaan_orders', JSON.stringify(orders));
            }, [orders]);

            }, [cart]);

            // Exchange rate: $1 = 26,000 SOS
            const formatPrice = (amount) => {
                if (currency === 'SOS') {
                    const sos = Math.round(amount * 26000);
                    return `${sos.toLocaleString()} SOS`;
                }
                return `$${parseFloat(amount).toFixed(2)}`;
            };

            // Filtered Products
            const filteredProducts = useMemo(() => {
                return products.filter(item => {
                    const matchCategory = selectedCategory === 'all' || item.category === selectedCategory;
                    const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                        item.name_so.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                        item.description.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchCategory && matchSearch;
                });
            }, [products, selectedCategory, searchQuery]);

            // Cart Calculations
            const cartSubtotal = useMemo(() => {
                return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            }, [cart]);

            const cartTax = cartSubtotal * 0.05; // 5% tax
            const cartDeliveryFee = orderType === 'delivery' ? 1.50 : 0.00;
            const cartGrandTotal = cartSubtotal + cartTax + cartDeliveryFee;
            const cartItemCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            // Open Customize Modal
            const handleOpenCustomize = (product) => {
                playBeep(700, 0.05);
                setCustomizingItem(product);
                setSelectedAddons([]);
                setItemNotes('');
            };

            // Toggle Addon
            const toggleAddon = (addon) => {
                playBeep(850, 0.04);
                if (selectedAddons.some(a => a.name === addon.name)) {
                    setSelectedAddons(selectedAddons.filter(a => a.name !== addon.name));
                } else {
                    setSelectedAddons([...selectedAddons, addon]);
                }
            };

            // Add Custom Item to Cart
            const handleAddCustomizedToCart = () => {
                if (!customizingItem) return;
                playBeep(900, 0.08);

                const addonsPrice = selectedAddons.reduce((sum, a) => sum + a.price, 0);
                const finalUnitPrice = customizingItem.price + addonsPrice;

                const cartItem = {
                    cartId: Date.now() + Math.random(),
                    id: customizingItem.id,
                    name: customizingItem.name,
                    name_so: customizingItem.name_so,
                    price: finalUnitPrice,
                    basePrice: customizingItem.price,
                    quantity: 1,
                    image: customizingItem.image,
                    addons: selectedAddons.map(a => a.name_so || a.name),
                    notes: itemNotes
                };

                setCart([...cart, cartItem]);
                setCustomizingItem(null);
                setIsCartOpen(true);
            };

            // Quick Add to Cart
            const handleQuickAddToCart = (product, e) => {
                e.stopPropagation();
                playBeep(800, 0.06);
                
                const existingIndex = cart.findIndex(i => i.id === product.id && (!i.addons || i.addons.length === 0));
                if (existingIndex > -1) {
                    const newCart = [...cart];
                    newCart[existingIndex].quantity += 1;
                    setCart(newCart);
                } else {
                    setCart([...cart, {
                        cartId: Date.now() + Math.random(),
                        id: product.id,
                        name: product.name,
                        name_so: product.name_so,
                        price: product.price,
                        basePrice: product.price,
                        quantity: 1,
                        image: product.image,
                        addons: [],
                        notes: ''
                    }]);
                }
            };

            // Update Cart Item Quantity
            const updateCartQuantity = (cartId, delta) => {
                playBeep(650, 0.04);
                setCart(prev => prev.map(item => {
                    if (item.cartId === cartId) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            // Remove Cart Item
            const removeCartItem = (cartId) => {
                playBeep(400, 0.08);
                setCart(cart.filter(item => item.cartId !== cartId));
            };

                                        cart.map(item => (
                                            <div key={item.cartId} className="bg-slate-800/80 rounded-2xl p-3 border border-slate-700/80 flex gap-3 items-center">
                                                <img src={item.image} alt={item.name} className="w-16 h-16 rounded-xl object-cover shrink-0" />
                                                <div className="flex-1 min-w-0">
                                                    <h4 className="font-bold text-xs text-white truncate">
                                                        {lang === 'so' ? item.name_so : item.name}
                                                    </h4>
                                                    {item.addons && item.addons.length > 0 && (
                                                        <span className="block text-[10px] text-amber-400/90 truncate">
                                                            + {item.addons.join(', ')}
                                                        </span>
                                                    )}
                                                    <span className="text-xs font-black text-amber-400 mt-1 block">
                                                        {formatPrice(item.price * item.quantity)}
                                                    </span>
                                                </div>

                                                {/* Quantity Controls */}
                                                <div className="flex items-center gap-2 bg-slate-900 px-2 py-1 rounded-xl border border-slate-700">
                                                    <button 
                                                        onClick={() => updateCartQuantity(item.cartId, -1)}
                                                        className="w-6 h-6 flex items-center justify-center text-xs font-bold text-slate-300 hover:text-white">
                                                        -
                                                    </button>
                                                    <span className="text-xs font-black text-white">{item.quantity}</span>
                                                    <button 
                                                        onClick={() => updateCartQuantity(item.cartId, 1)}
                                                        className="w-6 h-6 flex items-center justify-center text-xs font-bold text-slate-300 hover:text-white">
                                                        +
                                                    </button>
                                                </div>

                                                <button 
                                                    onClick={() => removeCartItem(item.cartId)}
                                                    className="text-xs text-slate-500 hover:text-red-400 p-1">
                                                    ✕
                                                </button>
                                            </div>
                                        ))
                                    )}

                                    {/* Order Type & Customer Details if cart not empty */}
                                    {cart.length > 0 && (
                                        <div className="pt-4 border-t border-slate-800 space-y-4">
                                            
                                            {/* Order Type */}
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">
                                                    {lang === 'so' ? 'Nooca Dalabka' : 'Order Service Type'}
                                                </label>
                                                <div className="grid grid-cols-3 gap-2">
                                                    {[
                                                        { id: 'dine_in', label: lang === 'so' ? '🍽️ Gudaha' : '🍽️ Dine-In' },
                                                        { id: 'takeaway', label: lang === 'so' ? '🛍️ Qaadasho' : '🛍️ Takeaway' },
                                                        { id: 'delivery', label: lang === 'so' ? '🛵 Geynta' : '🛵 Delivery' }
                                                    ].map(t => (
                                                        <button 
                                                            key={t.id}
                                                            type="button"
                                                            onClick={() => setOrderType(t.id)}
                                                            className={`py-2 text-xs font-bold rounded-xl border transition ${orderType === t.id ? 'bg-orange-600 border-orange-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>
                                                            {t.label}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Table selection if dine-in */}
                                            {orderType === 'dine_in' && (
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 block mb-1">
                                                        {lang === 'so' ? 'Lambarka Miiska' : 'Table Number'}
                                                    </label>
                                                    <select 
                                                        value={tableNumber} 
                                                        onChange={(e) => setTableNumber(e.target.value)}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                                                        <option value="Miiska 01">Miiska 01</option>
                                                        <option value="Miiska 02">Miiska 02</option>
                                                        <option value="Miiska 03">Miiska 03</option>
                                                        <option value="Miiska 04">Miiska 04</option>
                                                        <option value="Miiska 05">Miiska 05</option>
                                                        <option value="Miiska VIP">Qeybta VIP</option>
                                                    </select>
                                                </div>
                                            )}

                                            {/* Delivery Address if delivery */}
                                            {orderType === 'delivery' && (
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 block mb-1">
                                                        {lang === 'so' ? 'Goobta Loo Keenayo (Address)' : 'Delivery Address'}
                                                    </label>
                                                    <input 
                                                        type="text"
                                                        value={deliveryAddress}
                                                        onChange={(e) => setDeliveryAddress(e.target.value)}
                                                        placeholder={lang === 'so' ? 'Tus: KM4, Muqdisho / Dabaqa 2aad' : 'e.g. KM4, Mogadishu'}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-orange-500"
                                                    />
                                                </div>
                                            )}

                                            {/* Customer Name & Phone */}
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 block mb-1">
                                                        {lang === 'so' ? 'Magacaaga' : 'Your Name'}
                                                    </label>
                                                    <input 
                                                        type="text"
                                                        value={customerName}
                                                        onChange={(e) => setCustomerName(e.target.value)}
                                                        placeholder="Magaca"
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-orange-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 block mb-1">
                                                        {lang === 'so' ? 'Taleefanka' : 'Phone Number'}
                                                    </label>
                                                    <input 
                                                        type="text"
                                                        value={customerPhone}
                                                        onChange={(e) => setCustomerPhone(e.target.value)}
                                                        placeholder="061xxxxxxx"
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-orange-500"
                                                    />
                                                </div>
                                            </div>

                                            {/* Payment Options */}
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">
                                                    {lang === 'so' ? 'Habka Lacag-Bixinta' : 'Payment Method'}
                                                </label>
                                                <div className="grid grid-cols-2 gap-2 text-xs">
                                                    {[
                                                        { id: 'EVC_PLUS', label: '🟢 EVC Plus' },
                                                        { id: 'ZAAD', label: '🟠 Zaad Service' },
                                                        { id: 'SAHAL', label: '🔴 Sahal Pay' },
                                                        { id: 'CASH', label: '💵 Lacag Caddaan' }
                                                    ].map(p => (
                                                        <button 
                                                            key={p.id}
                                                            type="button"
                                                            onClick={() => setPaymentMethod(p.id)}
                                                            className={`py-2 px-3 rounded-xl border text-left font-bold transition ${paymentMethod === p.id ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>
                                                            {p.label}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                        </div>
                                    )}
                                </div>

                                {/* Drawer Footer (Checkout Button) */}
                                {cart.length > 0 && (
                                    <div className="p-5 bg-slate-950 border-t border-slate-800 space-y-3">
                                        <div className="space-y-1.5 text-xs text-slate-400">
                                            <div className="flex justify-between">
                                                <span>{lang === 'so' ? 'Dakhliga Cuntada' : 'Subtotal'}</span>
                                                <span className="text-white font-bold">{formatPrice(cartSubtotal)}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>{lang === 'so' ? 'Canshuur (5%)' : 'Tax (5%)'}</span>
                                                <span className="text-white font-bold">{formatPrice(cartTax)}</span>
                                            </div>
                                            {orderType === 'delivery' && (
                                                <div className="flex justify-between text-orange-400">
                                                    <span>{lang === 'so' ? 'Qiimaha Geynta' : 'Delivery Fee'}</span>
                                                    <span className="font-bold">{formatPrice(cartDeliveryFee)}</span>
                                                </div>
                                            )}
                                            <div className="flex justify-between text-sm pt-2 border-t border-slate-800 font-black text-white">
                                                <span>{lang === 'so' ? 'Wadarta Guud' : 'Grand Total'}</span>
                                                <span className="text-amber-400 text-base">{formatPrice(cartGrandTotal)}</span>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={handlePlaceOrder}
                                            disabled={isSubmitting}
                                            className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-black text-sm shadow-xl shadow-orange-600/30 transition transform active:scale-98 flex items-center justify-center gap-2">
                                            {isSubmitting ? (
                                                <span>⏳ Dalabka waa la gudbinayaa...</span>
                                            ) : (
                                                <>
                                                    <span>🚀</span>
                                                    <span>{lang === 'so' ? 'Xaqiiji Dalabka (Place Order)' : 'Confirm & Place Order'}</span>
                                                </>
                                            )}
                                        </button>
                                    </div>
                                )}

                            </div>
                        </div>
                    )}

                    {/* ============================================================ */}
                    {/* PRINTABLE RECEIPT MODAL */}
                    {/* ============================================================ */}
                    {receiptOrder && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in no-print-bg">
                            <div className="bg-white text-slate-900 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col">
                                
                                {/* Receipt Header */}
                                <div id="printable-receipt" className="p-6 text-center space-y-3 font-mono text-xs">
                                    <div className="border-b-2 border-dashed border-slate-300 pb-4">
                                        <div className="text-2xl font-black tracking-tight text-slate-900">
                                            🍔 GANAAN BURGER
                                        </div>
                                        <p className="text-[11px] text-slate-600 mt-0.5">Fast Food & Shawarma Spot</p>
                                        <p className="text-[10px] text-slate-500">Maka Al-Mukarama, Muqdisho</p>
                                        <p className="text-[10px] text-slate-500">Tel: +252 61 5000000</p>
                                    </div>

                                    {/* Order Meta */}
                                    <div className="text-left py-2 border-b border-dashed border-slate-300 space-y-1 text-[11px]">
                                        <div className="flex justify-between">
                                            <span className="text-slate-500">Dalabka #:</span>
                                            <span className="font-bold">{receiptOrder.id}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-slate-500">Taariikhda:</span>
                                            <span>{receiptOrder.date} - {receiptOrder.time}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-slate-500">Macmiilka:</span>
                                            <span className="font-bold">{receiptOrder.customerName}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-slate-500">Taleefanka:</span>
                                            <span>{receiptOrder.phone}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-slate-500">Adeegga:</span>
                                            <span className="font-bold uppercase">{receiptOrder.orderType}</span>
                                        </div>
                                        {receiptOrder.tableNumber && (
                                            <div className="flex justify-between font-bold text-orange-600">
                                                <span>Miiska:</span>
                                                <span>{receiptOrder.tableNumber}</span>
                                            </div>
                                        )}
                                        {receiptOrder.deliveryAddress && (
                                            <div className="text-[10px] text-slate-600">
                                                <span>Geynta: {receiptOrder.deliveryAddress}</span>
                                            </div>
                                        )}
                                    </div>

                                    {/* Items Table */}
                                    <div className="py-2 border-b-2 border-dashed border-slate-300 space-y-2 text-left">
                                        {receiptOrder.items.map((it, idx) => (
                                            <div key={idx} className="flex justify-between text-[11px]">
                                                <div>
                                                    <span className="font-bold mr-1">{it.quantity}x</span>
                                                    <span>{it.name_so || it.name}</span>
                                                    {it.addons && it.addons.length > 0 && (
                                                        <div className="text-[9px] text-slate-500 pl-4">
                                                            + {it.addons.join(', ')}
                                                        </div>
                                                    )}
                                                </div>
                                                <span className="font-bold">${(it.price * it.quantity).toFixed(2)}</span>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Totals */}
                                    <div className="pt-2 text-right space-y-1 text-xs">
                                        <div className="flex justify-between text-slate-600">
                                            <span>Subtotal:</span>
                                            <span>${receiptOrder.subtotal.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between text-slate-600">
                                            <span>Tax (5%):</span>
                                            <span>${receiptOrder.tax.toFixed(2)}</span>
                                        </div>
                                        {receiptOrder.deliveryFee > 0 && (
                                            <div className="flex justify-between text-slate-600">
                                                <span>Geynta:</span>
                                                <span>${receiptOrder.deliveryFee.toFixed(2)}</span>
                                            </div>
                                        )}
                                        <div className="flex justify-between text-sm font-black pt-2 border-t border-slate-300 text-slate-900">
                                            <span>WADARTA (USD):</span>
                                            <span>${receiptOrder.total.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between text-xs font-bold text-slate-700">
                                            <span>WADARTA (SOS):</span>
                                            <span>{(receiptOrder.total * 26000).toLocaleString()} SOS</span>
                                        </div>
                                        <div className="flex justify-between text-[10px] text-slate-500 pt-1">
                                            <span>Bixinta:</span>
                                            <span className="font-bold">{receiptOrder.paymentMethod}</span>
                                        </div>
                                    </div>

                                    {/* Receipt Footer */}
                                    <div className="pt-4 text-center border-t border-dashed border-slate-300 space-y-1 text-[10px] text-slate-500">
                                        <p className="font-bold text-slate-800">MAHADSANID! MAR KALE NAGU SOO LAABTA.</p>
                                        <p>Cuntada waxaa loo kariyaa si jacayl & nadaafad leh.</p>
                                        <div className="font-mono text-center tracking-widest text-[9px] pt-1">
                                            ||| | ||||| || |||||| |||| ||
                                        </div>
                                    </div>
                                </div>

                                {/* Modal Actions */}
                                <div className="p-4 bg-slate-100 border-t border-slate-200 flex gap-2 no-print">
                                    <button 
                                        onClick={() => window.print()}
                                        className="flex-1 py-2.5 bg-orange-600 hover:bg-orange-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
                                        <span>🖨️</span>
                                        <span>Daabac Rasiidka (Print)</span>
                                    </button>
                                    <button 
                                        onClick={() => setReceiptOrder(null)}
                                        className="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-xs font-bold transition">
                                        Xir
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-slate-950 border-t border-slate-900 py-8 text-center text-xs text-slate-500">
                        <div className="max-w-7xl mx-auto px-4 space-y-2">
                            <p className="font-bold text-slate-400">
                                © 2026 GANAAN BURGER & FAST FOOD RESTAURANT MANAGEMENT SYSTEM
                            </p>
                            <p>
                                Kudhisan React.js 18, Tailwind CSS, Express & MySQL Database • Waxaa loogu talagalay Muqayado Casri ah
                            </p>
                        </div>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
